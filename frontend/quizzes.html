</aside>

<!-- Main -->
<main class="flex-1 overflow-auto p-6">
  <div class="max-w-3xl mx-auto">

    <!-- Generate bar -->
    <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 mb-6">
      <h2 class="font-bold mb-4">Generate a new quiz</h2>
      <div class="flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-44">
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1">Document</label>
          <select id="gen-doc" class="w-full text-sm bg-slate-100 dark:bg-slate-700 border-0 rounded-lg px-3 py-2"><option value="">Select…</option></select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1">Questions</label>
          <select id="gen-count" class="text-sm bg-slate-100 dark:bg-slate-700 border-0 rounded-lg px-3 py-2">
            <option value="5">5</option><option value="10" selected>10</option><option value="15">15</option><option value="20">20</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-500 uppercase tracking-wide block mb-1">Difficulty</label>
          <select id="gen-diff" class="text-sm bg-slate-100 dark:bg-slate-700 border-0 rounded-lg px-3 py-2">
            <option value="mixed">Mixed</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option>
          </select>
        </div>
        <button id="gen-btn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-xl transition-colors">Generate Quiz</button>
      </div>
    </div>

    <!-- Quiz taking interface (hidden until active) -->
    <div id="quiz-interface" class="hidden mb-6">
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 id="quiz-title" class="font-bold text-lg"></h2>
            <p id="quiz-progress-text" class="text-sm text-slate-500"></p>
          </div>
          <button id="close-quiz" class="text-slate-400 hover:text-slate-600 text-xl">✕</button>
        </div>
        <div class="progress-bar mb-6"><div class="progress-bar__fill" id="quiz-progress-bar" style="width:0%"></div></div>

        <!-- Question -->
        <p id="question-text" class="text-base font-semibold mb-4 text-slate-800 dark:text-slate-200"></p>
        <div id="options-list" class="space-y-2 mb-6"></div>

        <!-- Explanation (shown after answer) -->
        <div id="explanation-box" class="hidden bg-slate-50 dark:bg-slate-700 rounded-xl p-4 mb-4 text-sm">
          <p class="font-semibold mb-1" id="answer-verdict"></p>
          <p id="explanation-text" class="text-slate-600 dark:text-slate-300"></p>
        </div>

        <div class="flex justify-between items-center">
          <span id="score-live" class="text-sm text-slate-500"></span>
          <button id="next-btn" class="hidden px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition-colors">Next →</button>
        </div>
      </div>
    </div>

    <!-- Results panel (hidden until done) -->
    <div id="results-panel" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 mb-6 text-center">
      <div class="text-5xl mb-3" id="result-emoji">🎉</div>
      <h2 class="text-2xl font-black mb-1" id="result-score"></h2>
      <p class="text-slate-500 mb-5" id="result-summary"></p>
      <div class="flex justify-center gap-3">
        <button id="retake-btn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition-colors">Retake Quiz</button>
        <button id="close-results-btn" class="px-5 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold rounded-xl transition-colors">Back to list</button>
      </div>
    </div>

    <!-- Quiz list -->
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-bold text-sm text-slate-600 dark:text-slate-400 uppercase tracking-wide">Your Quizzes</h2>
    </div>
    <div id="quiz-list" class="space-y-3">
      <div class="skeleton" style="height:72px;border-radius:0.75rem"></div>
      <div class="skeleton" style="height:72px;border-radius:0.75rem"></div>
    </div>
  </div>
</main>

<script type="module">
  import { loadClerk, redirectIfNotAuthenticated, mountUserButton } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';
  import { showToast, showLoading, hideLoading, renderEmptyState } from './assets/js/ui.js';
  import { truncateText, formatDate } from './assets/js/utils.js';

  if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

  let quizzes = [];
  let activeQuiz = null;
  let currentQIdx = 0;
  let answers = [];
  let startTime = null;

  (async () => {
    await loadClerk();
    await redirectIfNotAuthenticated('./auth/signin.html');
    await mountUserButton('#clerk-user-button');
    await Promise.all([loadDocuments(), loadQuizzes()]);

    // If ?id= param, open that quiz
    const id = new URLSearchParams(window.location.search).get('id');
    if (id) {
      const q = quizzes.find(q => q.id === id);
      if (q) startQuiz(q.id);
    }
  })();

  async function loadDocuments() {
    try {
      const resp = await api.get('/documents');
      const sel = document.getElementById('gen-doc');
      resp.data.filter(d => d.processing_status === 'ready').forEach(doc => {
        const opt = document.createElement('option');
        opt.value = doc.id; opt.textContent = truncateText(doc.title, 40);
        sel.appendChild(opt);
      });
    } catch (e) { /* silent */ }
  }

  async function loadQuizzes() {
    try {
      const resp = await api.get('/quizzes');
      quizzes = resp.data || [];
      renderQuizList();
    } catch (e) {
      showToast('Failed to load quizzes', 'error');
      document.getElementById('quiz-list').innerHTML = '';
    }
  }

  function renderQuizList() {
    const list = document.getElementById('quiz-list');
    if (!quizzes.length) {
      renderEmptyState(list, 'No quizzes yet', 'Generate a quiz from any of your documents.');
      return;
    }
    const diffColor = { easy: 'text-green-600', medium: 'text-amber-600', hard: 'text-red-600', mixed: 'text-indigo-600' };
    list.innerHTML = quizzes.map(q => `
      <div class="bg-white dark:bg-slate-800 rounded-xl px-4 py-3 border border-slate-200 dark:border-slate-700 flex items-center gap-3">
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 truncate">${q.title}</p>
          <p class="text-xs text-slate-500 mt-0.5">
            <span class="${diffColor[q.difficulty] || ''} font-medium capitalize">${q.difficulty}</span> ·
            ${q.question_count} questions · ${formatDate(q.created_at)}
          </p>
        </div>
        <button onclick="startQuiz('${q.id}')" class="px-3 py-1.5 bg-green-50 dark:bg-green-900/30 text-green-700 dark:text-green-300 text-xs font-semibold rounded-lg hover:bg-green-100 transition-colors flex-shrink-0">Take Quiz</button>
        <button onclick="deleteQuiz('${q.id}')" class="text-xs text-red-400 hover:text-red-600 flex-shrink-0 transition-colors">✕</button>
      </div>
    `).join('');
  }

  // Generate quiz
  document.getElementById('gen-btn').addEventListener('click', async () => {
    const docId = document.getElementById('gen-doc').value;
    if (!docId) { showToast('Select a document first', 'warning'); return; }
    const btn = document.getElementById('gen-btn');
    showLoading(btn, 'Generating…');
    try {
      const resp = await api.post('/quizzes/generate', {
        document_id: docId,
        question_count: parseInt(document.getElementById('gen-count').value),
        difficulty: document.getElementById('gen-diff').value,
      });
      quizzes.unshift(resp.data);
      renderQuizList();
      showToast('Quiz generated!', 'success');
      startQuiz(resp.data.id);
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      hideLoading(btn);
    }
  });

  window.startQuiz = async (quizId) => {
    try {
      const resp = await api.get(`/quizzes/${quizId}`);
      activeQuiz = resp.data;
      currentQIdx = 0;
      answers = [];
      startTime = Date.now();
      document.getElementById('quiz-interface').classList.remove('hidden');
      document.getElementById('results-panel').classList.add('hidden');
      document.getElementById('quiz-title').textContent = activeQuiz.title;
      document.getElementById('quiz-interface').scrollIntoView({ behavior: 'smooth' });
      showQuestion();
    } catch (e) {
      showToast(e.message, 'error');
    }
  };

  function showQuestion() {
    const q = activeQuiz.questions[currentQIdx];
    const total = activeQuiz.questions.length;
    document.getElementById('question-text').textContent = `${currentQIdx + 1}. ${q.question_text}`;
    document.getElementById('quiz-progress-text').textContent = `Question ${currentQIdx + 1} of ${total}`;
    document.getElementById('quiz-progress-bar').style.width = `${(currentQIdx / total) * 100}%`;
    document.getElementById('score-live').textContent = `Score: ${answers.filter(a => a.is_correct).length}/${currentQIdx}`;
    document.getElementById('explanation-box').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');

    const options = JSON.parse(q.options);
    document.getElementById('options-list').innerHTML = options.map(opt => `
      <button class="quiz-option" onclick="selectAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>
    `).join('');
  }

  window.selectAnswer = (btn, selected) => {
    const q = activeQuiz.questions[currentQIdx];
    const allBtns = document.querySelectorAll('.quiz-option');
    allBtns.forEach(b => b.disabled = true);

    const isCorrect = selected === q.correct_answer;
    answers.push({ question_id: q.id, selected_answer: selected, is_correct: isCorrect });

    // Highlight correct/incorrect
    allBtns.forEach(b => {
      if (b.textContent.trim() === q.correct_answer) b.classList.add('correct');
      else if (b === btn && !isCorrect) b.classList.add('incorrect');
    });
    if (isCorrect) btn.classList.add('correct');

    // Show explanation
    const expBox = document.getElementById('explanation-box');
    expBox.classList.remove('hidden');
    document.getElementById('answer-verdict').textContent = isCorrect ? '✓ Correct!' : '✕ Incorrect';
    document.getElementById('answer-verdict').className = `font-semibold mb-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}`;
    document.getElementById('explanation-text').textContent = q.explanation || '';

    document.getElementById('score-live').textContent = `Score: ${answers.filter(a => a.is_correct).length}/${currentQIdx + 1}`;

    const isLast = currentQIdx >= activeQuiz.questions.length - 1;
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = isLast ? 'See Results →' : 'Next →';
    nextBtn.classList.remove('hidden');
  };

  document.getElementById('next-btn').addEventListener('click', async () => {
    currentQIdx++;
    if (currentQIdx >= activeQuiz.questions.length) {
      await submitAttempt();
    } else {
      showQuestion();
    }
  });

  async function submitAttempt() {
    const timeSecs = Math.round((Date.now() - startTime) / 1000);
    try {
      const resp = await api.post(`/quizzes/${activeQuiz.id}/attempt`, {
        answers: answers.map(a => ({ question_id: a.question_id, selected_answer: a.selected_answer })),
        time_taken_seconds: timeSecs,
      });
      const attempt = resp.data;
      showResults(attempt);
    } catch (e) {
      showToast('Failed to submit attempt: ' + e.message, 'error');
    }
  }

  function showResults(attempt) {
    document.getElementById('quiz-interface').classList.add('hidden');
    const panel = document.getElementById('results-panel');
    panel.classList.remove('hidden');
    const score = Math.round(attempt.score || 0);
    document.getElementById('result-score').textContent = `${score}%`;
    document.getElementById('result-emoji').textContent = score >= 80 ? '🏆' : score >= 60 ? '👍' : '📚';
    document.getElementById('result-summary').textContent =
      `You got ${attempt.correct_answers} out of ${attempt.total_questions} questions correct.`;
    panel.scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('close-quiz').addEventListener('click', () => {
    document.getElementById('quiz-interface').classList.add('hidden');
  });
  document.getElementById('close-results-btn').addEventListener('click', () => {
    document.getElementById('results-panel').classList.add('hidden');
  });
  document.getElementById('retake-btn').addEventListener('click', () => {
    document.getElementById('results-panel').classList.add('hidden');
    startQuiz(activeQuiz.id);
  });

  window.deleteQuiz = async (id) => {
    if (!confirm('Delete this quiz?')) return;
    try {
      await api.delete(`/quizzes/${id}`);
      quizzes = quizzes.filter(q => q.id !== id);
      renderQuizList();
      showToast('Quiz deleted', 'success');
    } catch (e) { showToast(e.message, 'error'); }
  };
</script>
</body>
</html>
