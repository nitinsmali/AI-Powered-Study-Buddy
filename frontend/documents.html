<!-- Main -->
<main class="flex-1 overflow-auto p-6">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold">Documents</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mt-0.5">Upload and manage your study materials.</p>
      </div>
      <label for="file-input" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl transition-colors cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
        Upload
        <input id="file-input" type="file" class="hidden" accept=".pdf,.docx,.txt,.md" />
      </label>
    </div>

    <!-- Drop Zone -->
    <div id="drop-zone" class="drop-zone mb-6">
      <div class="text-4xl mb-3">📁</div>
      <p class="text-base font-semibold text-slate-700 dark:text-slate-300">Drag & drop files here</p>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Supports PDF, DOCX, TXT, Markdown — up to 50 MB</p>
      <div id="upload-progress" class="hidden mt-4">
        <div class="progress-bar max-w-xs mx-auto">
          <div class="progress-bar__fill" id="upload-bar" style="width:0%"></div>
        </div>
        <p id="upload-status" class="text-xs text-slate-500 mt-2"></p>
      </div>
    </div>

    <!-- Document List -->
    <div id="doc-list" class="space-y-3">
      <!-- Skeletons -->
      <div class="skeleton" style="height:80px;border-radius:1rem"></div>
      <div class="skeleton" style="height:80px;border-radius:1rem"></div>
      <div class="skeleton" style="height:80px;border-radius:1rem"></div>
    </div>
  </div>
</main>

<script type="module">
  import { loadClerk, redirectIfNotAuthenticated, mountUserButton } from './assets/js/auth.js';
  import { api } from './assets/js/api.js';
  import { showToast, renderEmptyState } from './assets/js/ui.js';
  import { formatFileSize, formatDate, truncateText } from './assets/js/utils.js';

  if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

  let documents = [];

  (async () => {
    await loadClerk();
    await redirectIfNotAuthenticated('./auth/signin.html');
    await mountUserButton('#clerk-user-button');
    await loadDocuments();
  })();

  async function loadDocuments() {
    try {
      const resp = await api.get('/documents', { limit: 100 });
      documents = resp.data || [];
      renderDocuments();
    } catch (e) {
      showToast('Failed to load documents', 'error');
      document.getElementById('doc-list').innerHTML = '';
    }
  }

  function renderDocuments() {
    const list = document.getElementById('doc-list');
    if (!documents.length) {
      renderEmptyState(list, 'No documents yet', 'Upload your first PDF, Word doc, or text file to get started.', 'Upload a file', () => document.getElementById('file-input').click());
      return;
    }
    const statusBadge = (s) => `<span class="badge badge--${s}">${s}</span>`;
    list.innerHTML = documents.map(doc => `
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 flex items-center gap-4 hover:shadow-md transition-shadow">
        <div class="text-3xl flex-shrink-0">${mimeIcon(doc.mime_type)}</div>
        <div class="flex-1 min-w-0">
          <a href="document.html?id=${doc.id}" class="font-semibold text-slate-800 dark:text-slate-200 hover:text-indigo-600 transition-colors truncate block">${doc.title}</a>
          <div class="flex items-center gap-3 mt-1 text-xs text-slate-500">
            <span>${formatFileSize(doc.file_size)}</span>
            ${doc.page_count ? `<span>${doc.page_count} pages</span>` : ''}
            <span>${formatDate(doc.created_at)}</span>
            ${statusBadge(doc.processing_status)}
          </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <a href="document.html?id=${doc.id}" class="px-3 py-1.5 text-xs font-semibold bg-indigo-50 dark:bg-indigo-900/30 text-indigo-700 dark:text-indigo-300 rounded-lg hover:bg-indigo-100 transition-colors">Open</a>
          <button onclick="deleteDoc('${doc.id}')" class="px-3 py-1.5 text-xs font-semibold bg-red-50 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-lg hover:bg-red-100 transition-colors">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function mimeIcon(mime) {
    if (mime.includes('pdf')) return '📕';
    if (mime.includes('word') || mime.includes('docx')) return '📘';
    if (mime.includes('markdown')) return '📓';
    return '📄';
  }

  window.deleteDoc = async (id) => {
    if (!confirm('Delete this document? This will also remove related summaries, flashcards, and quizzes.')) return;
    try {
      await api.delete(`/documents/${id}`);
      documents = documents.filter(d => d.id !== id);
      renderDocuments();
      showToast('Document deleted', 'success');
    } catch (e) {
      showToast(e.message, 'error');
    }
  };

  // File input handler
  document.getElementById('file-input').addEventListener('change', (e) => {
    if (e.target.files[0]) uploadFile(e.target.files[0]);
  });

  // Drag & drop
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) uploadFile(file);
  });

  async function uploadFile(file) {
    const progressEl = document.getElementById('upload-progress');
    const barEl = document.getElementById('upload-bar');
    const statusEl = document.getElementById('upload-status');

    progressEl.classList.remove('hidden');
    statusEl.textContent = `Uploading ${file.name}…`;
    barEl.style.width = '30%';

    const formData = new FormData();
    formData.append('file', file);
    formData.append('title', file.name.replace(/\.[^.]+$/, ''));

    try {
      barEl.style.width = '70%';
      const resp = await api.upload('/documents', formData);
      barEl.style.width = '100%';
      statusEl.textContent = 'Upload complete!';
      showToast(`"${resp.data.title}" uploaded successfully`, 'success');
      await loadDocuments();
    } catch (e) {
      showToast(e.message, 'error');
      statusEl.textContent = 'Upload failed.';
    } finally {
      setTimeout(() => progressEl.classList.add('hidden'), 2000);
    }
  }
</script>
</body>
